<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}ClinicCare - Quản lý phòng khám{% endblock %}
    </title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f6fb;
        color: #263449;
      }

      header {
        background: #145caa;
        color: white;
        padding: 20px 5%;
      }

      .brand {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 16px;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      nav a {
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 6px;
      }

      nav a:hover,
      nav a.active {
        background: rgba(255, 255, 255, 0.2);
      }

      main {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }

      .page-heading {
        margin-bottom: 22px;
      }

      .page-heading h1 {
        margin-bottom: 8px;
        color: #163b67;
      }

      .page-heading p {
        color: #64748b;
        margin: 0;
      }

      .card {
        background: white;
        padding: 24px;
        border-radius: 12px;
        margin-bottom: 24px;
        box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
      }

      .card h2 {
        margin-top: 0;
        font-size: 20px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .form-group.full {
        grid-column: 1 / -1;
      }

      label {
        font-weight: 600;
        font-size: 14px;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font: inherit;
        background: white;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #bfdbfe;
        border-color: #2563eb;
      }

      .btn {
        display: inline-block;
        border: none;
        border-radius: 7px;
        padding: 11px 16px;
        background: #1769c2;
        color: white;
        text-decoration: none;
        cursor: pointer;
        font-weight: 600;
      }

      .btn:hover {
        background: #104f95;
      }

      .btn-danger {
        background: #dc3545;
      }

      .btn-danger:hover {
        background: #b02a37;
      }

      .btn-secondary {
        background: #64748b;
      }

      .form-actions {
        margin-top: 18px;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
      }

      th,
      td {
        text-align: left;
        padding: 14px 12px;
        border-bottom: 1px solid #e5eaf1;
      }

      th {
        background: #edf4fc;
        color: #25486f;
        font-size: 13px;
      }

      tbody tr:hover {
        background: #f8fbff;
      }

      .alert {
        padding: 13px 16px;
        border-radius: 7px;
        margin-bottom: 18px;
      }

      .success {
        background: #dcfce7;
        color: #166534;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      .badge {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 20px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 12px;
      }

      .empty-state {
        text-align: center;
        color: #64748b;
        padding: 25px;
      }

      footer {
        text-align: center;
        color: #64748b;
        padding: 25px;
        font-size: 13px;
      }

      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .form-group.full {
          grid-column: auto;
        }

        main {
          padding: 0 12px;
          margin-top: 18px;
        }

        .card {
          padding: 16px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="brand">✚ ClinicCare</div>
      <nav>
        <a
          href="{{ url_for('patients') }}"
          class="{% if request.endpoint in ['patients', 'delete_patient'] %}active{% endif %}"
        >
          Bệnh nhân
        </a>

        <a
          href="{{ url_for('doctors') }}"
          class="{% if request.endpoint in ['doctors', 'delete_doctor'] %}active{% endif %}"
        >
          Bác sĩ
        </a>

        <a
          href="{{ url_for('appointments') }}"
          class="{% if request.endpoint in ['appointments', 'update_appointment_status'] %}active{% endif %}"
        >
          Lịch khám
        </a>
      </nav>
    </header>

    <main>
      {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert {{ category }}" role="status">{{ message }}</div>
      {% endfor %} {% block content %}{% endblock %}
    </main>

    <footer>ClinicCare — Hệ thống quản lý phòng khám/bệnh viện</footer>
  </body>
</html>
